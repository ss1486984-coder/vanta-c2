name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/vanta/c2
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > build.gradle <<'VEOF'
          buildscript {
              repositories { google(); mavenCentral() }
          }
          plugins {
              id 'com.android.application' version '8.5.0' apply false
          }
          VEOF

          cat > settings.gradle <<'VEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VantaApp"
          include ':app'
          VEOF

          cat > gradle.properties <<'VEOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          VEOF

          cat > app/build.gradle <<'VEOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.vanta.c2'
              compileSdk 34
              defaultConfig {
                  applicationId "com.vanta.c2"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'org.json:json:20240303'
              implementation 'androidx.core:core:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          VEOF

          cat > app/proguard-rules.pro <<'VEOF'
          # empty
          VEOF

          cat > app/src/main/res/values/strings.xml <<'VEOF'
          <resources>
              <string name="app_name">System Service</string>
          </resources>
          VEOF

          cat > app/src/main/res/values/themes.xml <<'VEOF'
          <resources>
              <style name="Theme.AppCompat.NoActionBar" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
              </style>
          </resources>
          VEOF

          cat > app/src/main/res/drawable/bg_input.xml <<'VEOF'
